name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set custom app icon
        run: |
          if [ -f www/logo.png ]; then
            mkdir -p android/app/src/main/res/mipmap-hdpi
            mkdir -p android/app/src/main/res/mipmap-mdpi
            mkdir -p android/app/src/main/res/mipmap-xhdpi
            mkdir -p android/app/src/main/res/mipmap-xxhdpi
            mkdir -p android/app/src/main/res/mipmap-xxxhdpi
            cp www/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp www/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp www/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp www/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp www/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp www/logo.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp www/logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            cp www/logo.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp www/logo.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            cp www/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            echo "Custom icon set from www/logo.png"
          else
            echo "logo.png not found"
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
